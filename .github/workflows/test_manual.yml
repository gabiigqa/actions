name: "Tests Manuales - Selección de servicio"

on:
  workflow_dispatch:
    inputs:
      servicio:
        description: 'Servicio a testear (opcional). Ej: account, auth, client, user'
        required: false
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '20'
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node-version || '20' }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --progress=false
      - name: Run tests
        run: |
          if [ -n "${{ github.event.inputs.servicio }}" ]; then
            npm run test:${{ github.event.inputs.servicio }}
          else
            npm test
          fi
        env:
          CI: true
