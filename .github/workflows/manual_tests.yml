name: "Test - Manual"

on:
  workflow_dispatch:
    inputs:
      servicio:
        description: 'Selecciona el servicio a testear'
        required: true
        type: choice
        options:
          - account
          - auth
          - client
          - user

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --progress=false
      - name: Run tests
        run: npm run test:${{ github.event.inputs.servicio }}
        env:
          CI: true
