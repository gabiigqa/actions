name: "Test - Manual"

on:
  workflow_dispatch:
    inputs:
      servicio:
        description: 'Selecciona el servicio a testear'
        required: true
        type: choice
        options:
          - account
          - auth
          - client
          - user

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify checkout
        run: |
          echo "Verifying package files..."
          test -f package.json && echo "✓ package.json found"
          test -f package-lock.json && echo "✓ package-lock.json found"
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      
      - name: Install dependencies
        run: npm ci --no-audit --progress=false
      
      - name: Run tests
        run: npm run test:${{ github.event.inputs.servicio }}
        env:
          CI: true
